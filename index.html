<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home dashboard · scrolling clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <div class="grid">
            <!-- TOP-LEFT: SCROLLING CLOCK -->
            <div class="margin margin-top-left">
                <div class="clock" id="gmtClockContainer">
                    <div class="hours">
                        <div class="first">
                            <div class="number" id="hour1">0</div>
                        </div>
                        <div class="second">
                            <div class="number" id="hour2">0</div>
                        </div>
                    </div>
                    <div class="tick">:</div>
                    <div class="minutes">
                        <div class="first">
                            <div class="number" id="min1">0</div>
                        </div>
                        <div class="second">
                            <div class="number" id="min2">0</div>
                        </div>
                    </div>
                    <div class="tick">:</div>
                    <div class="seconds">
                        <div class="first">
                            <div class="number" id="sec1">0</div>
                        </div>
                        <div class="second">
                            <div class="number" id="sec2">0</div>
                        </div>
                    </div>
                </div>
                <div class="date-display" id="gmtDate"></div>
            </div>

            <!-- TOP MIDDLE (empty) -->
            <div class="margin margin-top"></div>
            <div class="margin margin-top"></div>
            <div class="margin margin-top"></div>

            <!-- TOP-RIGHT: WEATHER -->
            <div class="margin margin-top-right" id="weatherContainer">
                <div class="weather-header">
                    <span class="weather-icon" id="currentWeatherIcon">⏳</span>
                    <div>
                        <div class="weather-location" id="weatherLocation">CRAWLEY</div>
                        <div class="weather-temp-large" id="currentTemp">--°C</div>
                        <div class="weather-temps">
                            <span class="temp-high" id="highTemp">H:--°</span>
                            <span class="temp-low" id="lowTemp">L:--°</span>
                        </div>
                    </div>
                </div>
                <div class="forecast-container" id="forecastContainer">
                    <div style="color: #666; text-align: center;">Loading weather data...</div>
                </div>
            </div>

            <!-- LEFT-MIDDLE: CALENDAR -->
            <div class="margin-left-calendar" id="calendarContainer">
                <div class="calendar-header" id="calendarHeader">
                    <span>📅</span> MOLEYS AGENDA
                </div>
                <div class="calendar-days" id="calendarDays">
                    <div style="color: #666; text-align: center;">Loading calendar...</div>
                </div>
            </div>

            <!-- Hidden grid cells for structure -->
            <div class="margin margin-left"></div>
            <div class="tile" style="display:none;"></div>
            <div class="tile" style="display:none;"></div>
            <div class="tile" style="display:none;"></div>
            <div class="margin margin-right"></div>

            <div class="margin margin-left"></div>
            <div class="tile" style="display:none;"></div>
            <div class="tile" style="display:none;"></div>
            <div class="tile" style="display:none;"></div>
            <div class="margin margin-right"></div>

            <div class="margin margin-left"></div>
            <div class="tile" style="display:none;"></div>
            <div class="tile" style="display:none;"></div>
            <div class="tile" style="display:none;"></div>
            <div class="margin margin-right"></div>

            <!-- BOTTOM: NEWS TICKER -->
            <div class="margin-bottom-merged" id="bottomContainer">
                <div class="news-ticker-container">
                    <div class="news-ticker" id="newsTicker">
                        <span class="news-badge">BBC NEWS</span>
                        <span class="news-item">Loading latest UK news...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
